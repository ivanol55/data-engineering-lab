# Alert rules for the lab.
#
# A rule that can never fire is worse than no rule: it looks like monitoring
# while hiding every incident. Every alert below has a threshold, a duration,
# a severity and a runbook.
groups:
  - name: lab-pipeline
    rules:
      - alert: RawEventsStale
        # The fixtures are historical, so this alert fires by design in the
        # lab. In a live pipeline the threshold is 24 hours of event time.
        expr: time() - max(lab_table_max_event_time_seconds{table="raw.login_events"}) > 86400
        for: 10m
        labels:
          severity: warning
          module: "01"
        annotations:
          summary: "Raw login events are stale"
          description: "No new event has arrived in the raw table for 24 hours."
          runbook_url: "https://github.com/ivanol55/data-engineering-lab/blob/main/docs/runbooks/stale-events.md"

      - alert: KafkaConsumerLagHigh
        # A single sample is noise; ten minutes of lag is a consumer that is
        # not keeping up.
        expr: sum by (group) (lab_kafka_consumer_lag) > 1000
        for: 10m
        labels:
          severity: warning
          module: "04"
        annotations:
          summary: "Kafka consumer lag is high"
          description: "A consumer group has more than 1,000 unread records."
          runbook_url: "https://github.com/ivanol55/data-engineering-lab/blob/main/docs/runbooks/kafka-lag.md"

      - alert: DecisionDependencyErrors
        # Alert on a sustained 5% error rate, not on a total outage that is
        # already obvious from the health check.
        expr: |
          (
            sum(rate(lab_dependency_errors_total[5m]))
            /
            clamp_min(sum(rate(lab_decisions_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          module: "07"
        annotations:
          summary: "Decision service dependency errors"
          description: "More than 5% of decisions failed to reach a dependency."
          runbook_url: "https://github.com/ivanol55/data-engineering-lab/blob/main/docs/runbooks/decision-errors.md"

      - alert: ConnectorTaskFailed
        expr: lab_connector_failed_tasks > 0
        for: 5m
        labels:
          severity: critical
          module: "05"
        annotations:
          summary: "A Debezium connector task is not running"
          description: "CDC is stopped; the lakehouse is diverging from Postgres."
          runbook_url: "https://github.com/ivanol55/data-engineering-lab/blob/main/docs/runbooks/connector-failed.md"
