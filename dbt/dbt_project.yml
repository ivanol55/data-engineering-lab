name: lab
version: "1.0.0"
config-version: 2
profile: lab

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  lab:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      # Lakekeeper + Trino can leave an orphaned __dbt_tmp relation after a
      # failed rename. CREATE OR REPLACE avoids the two-step rename.
      +on_table_exists: replace

# Defaults for `dbt build` without the module wrapper. The wrapper in
# modules/02-dbt-modelling/exercises/run.py overrides these from config.py.
vars:
  fct_incremental_strategy: "append"
  fct_unique_key: "event_id"
  intel_join_mode: "indicator_only"
  fct_late_window_days: 0
