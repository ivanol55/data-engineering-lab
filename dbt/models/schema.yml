version: 2

models:
  - name: stg_users
    description: "One current row per user_id."
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: account_status
        tests: [not_null]

  - name: stg_login_events
    description: "One row per event_id, typed and deduplicated."
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_time
        tests: [not_null]
      - name: user_id
        tests: [not_null]

  - name: stg_threat_intel
    description: "One row per (indicator, valid_from), latest revision."
    columns:
      - name: intel_key
        tests: [not_null, unique]
      - name: indicator
        tests: [not_null]
      - name: valid_from
        tests: [not_null]

  - name: int_login_risk_inputs
    description: "One row per event after the user and intel joins."
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id

  - name: fct_login_events
    description: "Decision features and outcome, one row per event."
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_time
        tests: [not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id

  - name: dim_users
    description: "Current user identity attributes."
    columns:
      - name: user_id
        tests: [not_null, unique]
